services:
  - type: web
    name: selo-audio-master-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.server --host 0.0.0.0 --port $PORT --no-browser
    healthCheckPath: /api/engines
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PYTHONUNBUFFERED
        value: "1"
